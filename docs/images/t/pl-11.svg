<svg xmlns="http://www.w3.org/2000/svg" width="643" height="112" viewBox="0 0 643 112"><g font-family="Consolas,'DejaVu Sans Mono',monospace" font-weight="700" font-size="17" fill="#2ee66b" style="white-space:pre"><text x="322" y="20" text-anchor="middle">Możesz pobrać go z tej strony i używać na własnym komputerze.</text><text x="322" y="46" text-anchor="middle">Nie wolno go dawać innym osobom, wrzucać gdzie indziej,</text><text x="322" y="72" text-anchor="middle">sprzedawać, używać w firmie ani zmieniać. Każdy pobiera swoją</text><text x="322" y="98" text-anchor="middle">kopię z tej oficjalnej strony.</text></g></svg>