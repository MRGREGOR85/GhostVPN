<svg xmlns="http://www.w3.org/2000/svg" width="653" height="86" viewBox="0 0 653 86"><g font-family="Consolas,'DejaVu Sans Mono',monospace" font-weight="700" font-size="17" fill="#2ee66b" style="white-space:pre"><text x="326" y="20" text-anchor="middle">Twój login VPN jest szyfrowany przez Windows (DPAPI) i zostaje</text><text x="326" y="46" text-anchor="middle">na Twoim komputerze. GhostVPN nie ma konta, reklam ani</text><text x="326" y="72" text-anchor="middle">śledzenia.</text></g></svg>