<svg xmlns="http://www.w3.org/2000/svg" width="631" height="85" viewBox="0 0 631 85"><g font-family="Consolas,'DejaVu Sans Mono',monospace" font-weight="700" font-size="17" fill="#2ee66b" style="white-space:pre"><text x="316" y="23" text-anchor="middle">Twój login VPN jest szyfrowany przez Windows (DPAPI) i zostaje</text><text x="316" y="48" text-anchor="middle">na Twoim komputerze. GhostVPN nie ma konta, reklam ani</text><text x="316" y="73" text-anchor="middle">śledzenia.</text></g></svg>