<svg xmlns="http://www.w3.org/2000/svg" width="621" height="110" viewBox="0 0 621 110"><g font-family="Consolas,'DejaVu Sans Mono',monospace" font-weight="700" font-size="17" fill="#2ee66b" style="white-space:pre"><text x="310" y="23" text-anchor="middle">Możesz pobrać go z tej strony i używać na własnym komputerze.</text><text x="310" y="48" text-anchor="middle">Nie wolno go dawać innym osobom, wrzucać gdzie indziej,</text><text x="310" y="73" text-anchor="middle">sprzedawać, używać w firmie ani zmieniać. Każdy pobiera swoją</text><text x="310" y="98" text-anchor="middle">kopię z tej oficjalnej strony.</text></g></svg>